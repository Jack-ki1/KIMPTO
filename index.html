<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kimpto — Prompt Engineering Studio</title>
  <meta name="description" content="Kimpto turns a task description into several prompt-engineered versions, grounded in real prompting research, with a 40+ free model tier and bring-your-own-key support for Claude and Gemini." />
  <meta name="theme-color" content="#0e0e11" />

  <!-- All paths below are relative on purpose: GitHub Pages project sites
       are served from a subpath (username.github.io/repo-name/), so an
       absolute path like /css/styles.css would 404 there even though it
       works fine when previewed from a server rooted at "/". -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" />
  <link rel="icon" href="./icons/favicon-64.png" sizes="64x64" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app">
    <p id="bootError" class="boot-error" hidden></p>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-inner">
        <div class="brand-row">
          <div class="k-mark k-mark-sm"><span>K</span></div>
          <span class="brand-name">Kimpto</span>
        </div>

        <button id="newSessionBtn" class="new-session-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          New generation
        </button>

        <div class="search-box">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="sidebarSearch" type="text" placeholder="Search…" autocomplete="off" />
        </div>

        <div class="sidebar-tabs">
          <button id="tabHistoryBtn" class="sidebar-tab active">History</button>
          <button id="tabLibraryBtn" class="sidebar-tab">Library</button>
        </div>

        <div id="sidebarList" class="sidebar-list"></div>
        <div id="todayCounter" class="today-counter" hidden></div>
      </div>
    </aside>

    <div class="main-col">
      <div class="topbar">
        <button id="sidebarToggleBtn" class="icon-btn" title="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <div class="spacer"></div>
        <button id="themeToggleBtn" class="icon-btn" title="Toggle theme">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button id="settingsToggleBtn" class="icon-btn" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
        </button>
      </div>

      <div class="scroll-area">
        <div id="emptyState" class="empty-state">
          <div class="hero-logo-wrap">
            <div class="hero-blob"></div>
            <div class="k-mark k-mark-lg"><span>K</span></div>
          </div>
          <h1 class="welcome-heading">Welcome to Kimpto — prompt your goal into existence.</h1>
          <div id="heroComposerMount" class="composer-mount"></div>
        </div>

        <div id="threadArea" class="thread-area" hidden></div>
      </div>

      <div id="dockedComposerWrap" class="docked-composer-wrap" hidden>
        <div id="dockedComposerMount" class="composer-mount"></div>
      </div>
    </div>

    <div id="settingsOverlay" class="settings-overlay" hidden>
      <div class="settings-panel">
        <div class="settings-panel-head">
          <h2>Settings</h2>
          <button id="settingsCloseBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="settingsBody" class="settings-body"></div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
  <script src="https://js.puter.com/v2/"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
