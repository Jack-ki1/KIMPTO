<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Kimpto — Prompt Engineering Studio{% endblock %}</title>
  <meta name="description" content="Kimpto turns a task description into several prompt-engineered versions, grounded in real prompting research, with a 40+ free model tier and bring-your-own-key support for Claude, GPT, and Gemini." />
  <meta name="theme-color" content="#0e0e11" />

  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}" />
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon-32.png') }}" sizes="32x32" />
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon-64.png') }}" sizes="64x64" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("{{ url_for('static', filename='service-worker.js') }}").catch(() => {});
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
